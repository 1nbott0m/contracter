[workspace]
members = ["crates/db", "crates/economy-core", "crates/api", "crates/application", "crates/server"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
db = { path = "crates/db" }
economy-core = { path = "crates/economy-core" }
application = { path = "crates/application" }
api = { path = "crates/api" }
rust_decimal = "1"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
chrono = { version = "0.4", features = ["clock"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.8"
tower = "0.5"
tower-http = "0.6"
tower_governor = "0.8"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
