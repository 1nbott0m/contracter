services:
  - type: web
    name: contracter-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: METRICS_HOST
        value: 0.0.0.0
      - key: CORS_ALLOWED_ORIGINS
        value: https://contracter-1t9.pages.dev
      - key: DATABASE_URL
        sync: false
      - key: QUOTE_SIGNING_KEY
        sync: false
      - key: QUOTE_SEED_KEY
        sync: false
