[package]
name = "api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
application.workspace = true
db.workspace = true
axum = { workspace = true, features = ["json"] }
tower = { workspace = true, features = ["timeout", "util"] }
tower-http = { workspace = true, features = ["trace", "cors", "catch-panic", "limit"] }
tower_governor.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true
# Fixture setup only (issuing invitations, disabling accounts); the
# production path still reaches PostgreSQL exclusively through `db`.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
