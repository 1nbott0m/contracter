[package]
name = "application"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
db.workspace = true
thiserror.workspace = true
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
rand = "0.8"
sha2.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true
rust_decimal.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Fixture setup only (issuing invitations, forcing expiry). The production
# dependency graph still reaches PostgreSQL exclusively through `db`.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
